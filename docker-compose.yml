version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: honeychain-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-honeychain_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-honeychain_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: honeychain_postgres_data
