spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:honeychain_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.nexora.honeychain: DEBUG
    org.hibernate.SQL: DEBUG

honeychain:
  iot:
    api-key: ${IOT_API_KEY:HoneyChain-IoT-Device-Key-2026}
  blockchain:
    enabled: ${BLOCKCHAIN_ENABLED:true}
    rpc-url: ${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
    contract-address: ${BLOCKCHAIN_CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}
    private-key: ${BLOCKCHAIN_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
    chain-id: ${BLOCKCHAIN_CHAIN_ID:31337}
    network-name: ${BLOCKCHAIN_NETWORK_NAME:Localhost EVM}

