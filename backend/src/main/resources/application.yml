spring:
  application:
    name: honeychain-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

honeychain:
  project:
    name: HoneyChain
    sih-id: SIH26021
    team: Nexora
    version: 1.0.0-phase3

jwt:
  secret: ${JWT_SECRET:HoneyChainSecretKeyForJwtSigningMustBeAtLeast256BitsLongForHS256Algorithm!}
  expiration: ${JWT_EXPIRATION:86400}

