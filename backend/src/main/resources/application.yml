spring:
  application:
    name: honeychain-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

honeychain:
  project:
    name: HoneyChain
    sih-id: SIH26021
    team: Nexora
    version: 1.0.0-phase3
  iot:
    api-key: ${IOT_API_KEY:HoneyChain-IoT-Device-Key-2026}
  blockchain:
    enabled: ${BLOCKCHAIN_ENABLED:false}
    rpc-url: ${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
    private-key: ${BLOCKCHAIN_PRIVATE_KEY:}
    contract-address: ${BLOCKCHAIN_CONTRACT_ADDRESS:}
    chain-id: ${BLOCKCHAIN_CHAIN_ID:31337}
    network-name: ${BLOCKCHAIN_NETWORK_NAME:Localhost EVM}

jwt:
  secret: ${JWT_SECRET:HoneyChainSecretKeyForJwtSigningMustBeAtLeast256BitsLongForHS256Algorithm!}
  expiration: ${JWT_EXPIRATION:86400}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173,http://192.168.0.144:5173}

